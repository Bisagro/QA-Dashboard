```html
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>QA - Dashboard</title>

  <link rel="stylesheet" href="root.css">
  <link rel="icon" type="image/x-icon" href="media/logo.ico">
</head>

<body>

  <h1>QA Dashboard</h1>

  <div id="status">Loading...</div>

  <pre id="results"></pre>

  <script>
    // ==========================================
    // YOUR RENDER BACKEND
    // ==========================================

    const API_URL = "https://qa-dashboard-api.onrender.com/api/csat";


    // ==========================================
    // LOAD DATA
    // ==========================================

    async function loadData() {
      const status = document.getElementById("status");
      const results = document.getElementById("results");

      try {
        status.textContent = "Connecting to database...";

        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error(
            `API returned ${response.status}`
          );
        }

        const data = await response.json();

        console.log("MongoDB data:", data);

        status.textContent =
          `Loaded ${data.length} records`;

        results.textContent =
          JSON.stringify(data, null, 2);

      } catch (error) {

        console.error("API Error:", error);

        status.textContent =
          "Failed to load data";

        results.textContent =
          error.message;
      }
    }

    loadData();
  </script>

</body>
</html>
