name: Generate CSAT Web Page

on:
  push:
    branches: [ "main" ]  # Change to "master" if your primary branch is master
  workflow_dispatch:      # Adds a manual "Run workflow" button in GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Grants permission to save index.html back to repo

    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install MongoDB driver
        run: npm install mongodb

      - name: Run index.js
        run: node index.js
        env:
          MY_DATABASE_URL: ${{ secrets.MONGODB_SHOPEEMY_EP_URL }}

      - name: Commit and push generated index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Automated update of index.html from MongoDB" || exit 0
          git push
