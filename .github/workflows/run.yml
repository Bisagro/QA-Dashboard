name: Generate CSAT Web Page

on:
  push:
    branches: [ "main" ]  # Runs whenever you edit code
  workflow_dispatch:      # Gives you a manual "Run workflow" button
  schedule:
    - cron: '0 0 * * *'   # Optional: Runs automatically once a day at midnight

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Gives GitHub Actions permission to save index.html

    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install MongoDB driver
        run: npm install mongodb

      - name: Run index.js to generate index.html
        run: node index.js
        env:
          MONGODB_SHOPEEMY_EP_URL: ${{ secrets.MONGODB_SHOPEEMY_EP_URL }}

      - name: Save index.html back to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Automated update of index.html" || exit 0
          git push
